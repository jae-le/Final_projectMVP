# Server Configuration
spring.application.name=boot_mvp
server.port=8282
server.servlet.session.timeout=30m

# Spring MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Database config
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
#spring.datasource.url=jdbc:log4jdbc:mysql://192.168.0.141:3306/mvpdb?useSSL=false&allowPublicKeyRetrieval=true
# 내장 MariaDB (Config/EmbeddedMariaDbConfig). 외부 DB를 쓰려면 enabled=false 로 바꾸고 위 URL 중 하나를 사용
mvp.embedded-db.enabled=true
mvp.embedded-db.port=13307
mvp.embedded-db.data-dir=./db-data
spring.datasource.url=jdbc:log4jdbc:mysql://127.0.0.1:13307/mvpdb?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
#spring.datasource.url=jdbc:log4jdbc:mysql://localhost:3306/mvpdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mvp
spring.datasource.password=1234


spring.batch.initialize-schema=always
# Boot 2.7 에서 쓰는 키 (위 키는 구버전 이름)
spring.batch.jdbc.initialize-schema=always
# 영화 배치(TMDB/KOBIS 로 movietb, boxofficetb 를 지우고 다시 채움): 내장 DB 샘플 데이터를 유지하려고 꺼 둠
#  - 기동 시 자동 실행 끄기 / 매일 09:02 스케줄 끄기(-). 실데이터로 갱신하려면 true / "0 02 09 * * ?" 로 바꿀 것
spring.batch.job.enabled=false
mvp.movie-batch.cron=-

# MyBatis config
mybatis.config-location=classpath:mybatis-config.xml

# JSON 인코딩
